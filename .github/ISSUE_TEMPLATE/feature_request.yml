name: Feature request
description: Idea for something RingKeeper should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: "e.g. 'I rotate to nights every other week and the baseline gets confused.'"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
  - type: markdown
    attributes:
      value: "Out of scope: Oura cloud/API use, Oura's proprietary models, medical, fitness-for-duty or contraception claims."
